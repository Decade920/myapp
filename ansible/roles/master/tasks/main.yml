#     - tigera-operator.yaml
#     - custom-resources.yaml
#     - operator-crds.yaml

- name: 替换calico镜像地址为华为云
  ansible.builtin.shell: |
    kubectl patch installation default --type merge -p '{"spec":{"registry":"swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"}}'
  register: calico_patch_result
  until: calico_patch_result.rc == 0
  retries: 5
  delay: 5

- name: 修改custom-resources.yaml中的pod网段
  ansible.builtin.replace:
    path: "/tmp/custom-resources.yaml"
    regexp: 'cidr:\s+192\.168\.0\.0/16'
    replace: "cidr: 10.244.0.0/16"

- name: 依次应用Calico清单
  ansible.builtin.shell: "kubectl apply --server-side --force-conflicts -f /tmp/{{ item }}"
  loop:
    - tigera-operator.yaml
    - custom-resources.yaml
    - operator-crds.yaml

- name: 获取加入集群的token
  shell: kubeadm token create --print-join-command
  register: join_command

- name: 将join命令写入文件（供worker节点使用）
  copy:
    content: "{{ join_command.stdout }}"
    dest: /tmp/join_command.sh
  delegate_to: localhost
  become: false

- name: 允许pod调度到master节点（移除污点）
  shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  register: taint_result
  failed_when:
    - taint_result.rc != 0
    - "'not found' not in taint_result.stderr and 'not found' not in taint_result.stdout"
  changed_when: taint_result.rc == 0

