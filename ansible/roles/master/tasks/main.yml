# yaml-language-server: $schema:https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json
- name: 初始化 Master节点（国内源）
  shell: |
    kubeadm init \
      --apiserver-advertise-address={{ ansible_facts['default_ipv4']['address'] }} \
      --pod-network-cidr=10.244.0.0/16 \
      --image-repository=registry.aliyuncs.com/google_containers
  args:
    creates: /etc/kubernetes/admin.conf

- name: 创建root用户的 .kube 目录
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: 将 admin.conf 复制为root用户的 kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    mode: "0600"

- name: 下载 Calico 安装清单
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: "0644"
    timeout: 60
  loop:
    - tigera-operator.yaml
    - custom-resources.yaml
    - operator-crds.yaml
  register: calico_result
  until: calico_result is succeeded
  retries: 3
  delay: 5

# - name: 替换Calico镜像地址为阿里云源
#   ansible.builtin.replace:
