apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: flask-service-monitor
    namespace: monitoring
    labels:
        release: app-monitoring
spec:
    selector:
        matchLabels:
            app: flask-app
    namespaceSelector:
        matchNames:
            - default
    endpoints:
      - port: http
        interval: 15s
        path: /metrics