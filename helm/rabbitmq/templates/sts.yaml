apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: default
spec:
  replicas: 1  # 👈 必须改回 1
  serviceName: rabbitmq-service
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # 👈 换成国内镜像加速，防止拉取超时
          image: docker.1ms.run/library/rabbitmq:3.13-management-alpine
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            # 👈 加上这行，防止数据损坏
            - name: RABBITMQ_ERLANG_COOKIE
              value: "my-secret-cookie-string"
            - name: RABBITMQ_DEFAULT_USER
              value: "admin"
            - name: RABBITMQ_DEFAULT_PASS
              value: "admin123"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          # ... 探针和资源限制保留你原来的 ...
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
