apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: default
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
  clusterIP: None  # 保留无头，给内部微服务连
---
# 给浏览器访问用的服务
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-mgmt
  namespace: default
spec:
  selector:
    app: rabbitmq
  type: NodePort
  ports:
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30672  # 分配一个 30000-32767 的端口
